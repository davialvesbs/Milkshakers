<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — MilkShakers</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800;900&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --blue:        #0164fd;
  --blue-dark:   #003caa;
  --blue-deep:   #004bbd;
  --white:       #FFFFFF;
  --off-white:   #F4F0E7;
  --orange:      #FF7A00;
  --orange-dark: #E85D04;
  --text:        #111111;

  --font-display: "Unbounded", sans-serif;
  --font-body: "Manrope", sans-serif;
  --ease: cubic-bezier(.22,.85,.3,1);
}

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  font-family: var(--font-body);
  background: var(--blue);
  color:#fff;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow-x:hidden;
  position:relative;
  padding: 32px 20px 60px;
}

/* textura sutil */
body::before{
  content:"";
  position:fixed; inset:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  opacity:.05;
  mix-blend-mode:overlay;
  pointer-events:none;
  z-index:0;
}

main{
  position:relative; z-index:2;
  max-width: 560px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-weight:700;
  font-size:.82rem;
  color:#ffcfa0;
  margin-bottom:16px;
}
.eyebrow .dot{ width:8px; height:8px; border-radius:50%; background:var(--orange); }

.code-404{
  font-family: var(--font-display);
  font-weight:900;
  font-size: clamp(4rem, 14vw, 7rem);
  line-height:1;
  letter-spacing:-2px;
  color:#fff;
}
.code-404 span{ color: var(--orange); }

h1{
  font-family: var(--font-display);
  font-weight:700;
  font-size: clamp(1.4rem, 3.4vw, 2rem);
  margin: 10px 0 12px;
}

p.sub{
  font-size:1rem;
  color:#dbe6ff;
  max-width:44ch;
  margin-bottom: 34px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  justify-content:center;
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-family: var(--font-display);
  font-weight:600;
  font-size:.92rem;
  padding: 14px 26px;
  border-radius:100px;
  transition: transform .3s var(--ease), background .25s ease;
}
.btn:hover{ transform: translateY(-3px); }
.btn-primary{
  background: var(--orange);
  color:#fff;
  box-shadow: 0 10px 24px -10px rgba(255,90,0,.5);
}
.btn-primary:hover{ background: var(--orange-dark); }
</style>
</head>
<body>

<main>
  <span class="eyebrow"><span class="dot"></span> Erro 404</span>
  <div class="code-404">4<span>0</span>4</div>
  <h1>Página não encontrada.</h1>
  <p class="sub">Não encontramos o que você procurava. O endereço pode estar errado ou a página pode ter sido removida.</p>
  <div class="actions">
    <a href="index.html" class="btn btn-primary">Voltar para o início</a>
  </div>
</main>

</body>
</html>
